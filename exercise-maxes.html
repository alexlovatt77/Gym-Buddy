<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eef2" />
    <script src="js/theme.js?v=3"></script>
    <meta name="apple-mobile-web-app-title" content="Gym Buddy" />
    <title>Maxes — Gym Buddy</title>
    <link rel="stylesheet" href="css/styles.css?v=9" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <p class="masthead__brand"><a href="today.html" class="masthead__brand-link">Gym Buddy</a></p>
      </header>

      <main class="page">
        <p class="page__kicker">Records</p>
        <h1 class="page__title">Maxes</h1>

        <section class="section" aria-labelledby="log-max">
          <h2 class="section__title" id="log-max">Record a best</h2>

          <form class="record-form" id="max-form">
            <div class="record-form__grid">
              <div class="field">
                <label for="max-type">Type</label>
                <select id="max-type" required>
                  <option value="rm1">1-rep max</option>
                  <option value="rm8">8-rep max</option>
                  <option value="mile1">1 mile</option>
                  <option value="mile3">3 mile</option>
                </select>
              </div>
              <div class="field" id="max-exercise-field">
                <label for="max-exercise">Exercise</label>
                <select id="max-exercise" required></select>
              </div>
              <div class="field" id="max-weight-field">
                <label for="max-weight">Weight</label>
                <div class="record-form__weight">
                  <select id="max-weight" required></select>
                  <span class="record-form__unit">lbs</span>
                </div>
              </div>
              <div class="field" id="max-time-field" hidden>
                <span class="field-legend" id="max-time-legend">Time</span>
                <div class="select-cluster" role="group" aria-labelledby="max-time-legend">
                  <div class="select-cluster__item">
                    <label for="max-time-min">Min</label>
                    <select id="max-time-min" required></select>
                  </div>
                  <span class="select-cluster__sep" aria-hidden="true">:</span>
                  <div class="select-cluster__item">
                    <label for="max-time-sec">Sec</label>
                    <select id="max-time-sec" required></select>
                  </div>
                </div>
              </div>
            </div>
            <p class="field-error" id="max-error" hidden></p>
            <div class="btn-row">
              <button class="btn" type="submit">Save best</button>
            </div>
          </form>
        </section>

        <section class="section" aria-labelledby="max-1rm">
          <h2 class="section__title" id="max-1rm">1-rep maxes</h2>
          <table class="ledger">
            <thead>
              <tr>
                <th>Exercise</th>
                <th class="num">Best</th>
                <th class="num">Date</th>
              </tr>
            </thead>
            <tbody id="table-1rm"></tbody>
          </table>
        </section>

        <section class="section" aria-labelledby="max-8rm">
          <h2 class="section__title" id="max-8rm">8-rep maxes</h2>
          <table class="ledger">
            <thead>
              <tr>
                <th>Exercise</th>
                <th class="num">Best</th>
                <th class="num">Date</th>
              </tr>
            </thead>
            <tbody id="table-8rm"></tbody>
          </table>
        </section>

        <section class="section" aria-labelledby="max-cardio">
          <h2 class="section__title" id="max-cardio">Cardio maxes</h2>
          <table class="ledger">
            <thead>
              <tr>
                <th>Distance</th>
                <th class="num">Best</th>
                <th class="num">Date</th>
              </tr>
            </thead>
            <tbody id="table-cardio"></tbody>
          </table>
        </section>

        <section class="section" aria-labelledby="max-progress">
          <h2 class="section__title" id="max-progress">Progress</h2>

          <div class="chart-slideshow">
            <div class="cal-nav">
              <button class="btn btn--ghost" type="button" id="progress-prev" aria-label="Previous slide">
                ←
              </button>
              <p class="cal-nav__label" id="progress-slide-label">—</p>
              <button class="btn btn--ghost" type="button" id="progress-next" aria-label="Next slide">
                →
              </button>
            </div>
            <p class="chart-slide-meta" id="progress-slide-meta"></p>
            <div class="chart-frame" id="max-chart" role="img" aria-label="Max progress chart"></div>
            <div class="chart-dots" id="progress-dots" aria-hidden="true"></div>

            <h3 class="section__title" style="margin-top: 1.5rem">Recorded bests</h3>
            <table class="ledger">
              <thead>
                <tr>
                  <th>Date</th>
                  <th class="num" id="progress-value-head">Best</th>
                  <th class="num"></th>
                </tr>
              </thead>
              <tbody id="max-history-body">
                <tr class="is-placeholder">
                  <td colspan="3">No bests yet</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <div class="sheet" id="edit-date-sheet" hidden>
        <div class="sheet__backdrop" data-close-date tabindex="-1"></div>
        <div
          class="sheet__panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="edit-date-title"
        >
          <div class="sheet__header">
            <h2 class="sheet__title" id="edit-date-title">Change date</h2>
            <button class="sheet__close" type="button" data-close-date aria-label="Close">
              Close
            </button>
          </div>
          <form class="record-form" id="edit-date-form">
            <div class="field">
              <span class="field-legend" id="edit-date-legend">Date</span>
              <div class="select-cluster select-cluster--date" role="group" aria-labelledby="edit-date-legend">
                <div class="select-cluster__item select-cluster__item--grow">
                  <label for="edit-month">Month</label>
                  <select id="edit-month" required></select>
                </div>
                <div class="select-cluster__item">
                  <label for="edit-day">Day</label>
                  <select id="edit-day" required></select>
                </div>
                <div class="select-cluster__item">
                  <label for="edit-year">Year</label>
                  <select id="edit-year" required></select>
                </div>
              </div>
            </div>
            <p class="field-error" id="edit-date-error" hidden></p>
            <div class="btn-row">
              <button class="btn" type="submit">Save date</button>
            </div>
          </form>
        </div>
      </div>

      <nav class="tabbar" aria-label="Primary">
        <a href="today.html"><span class="tabbar__word">Day</span></a>
        <a href="sets-per-week.html"><span class="tabbar__word">Week</span></a>
        <a href="exercise-maxes.html"><span class="tabbar__word">Maxes</span></a>
        <a href="daily-macro.html"><span class="tabbar__word">Macros</span></a>
        <a href="weight-tracking.html"><span class="tabbar__word">Weight</span></a>
        <a href="water.html"><span class="tabbar__word">Water</span></a>
        <a href="settings.html"><span class="tabbar__word">Settings</span></a>
      </nav>
    </div>
    <script src="js/app-data.js?v=2"></script>
    <script src="js/nav.js"></script>
    <script src="js/undo.js"></script>
    <script src="js/maxes.js?v=2"></script>
  </body>
</html>
