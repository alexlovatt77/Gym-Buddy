<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eef2" />
    <script src="js/theme.js"></script>
    <meta name="apple-mobile-web-app-title" content="Gym Buddy" />
    <title>Day — Gym Buddy</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <p class="masthead__brand">Gym Buddy</p>
      </header>

      <main class="page">
        <p class="page__kicker">Live log</p>
        <h1 class="page__title">Day</h1>

        <section class="section" aria-labelledby="session-day">
          <h2 class="section__title" id="session-day">Day</h2>
          <p class="section__note" id="session-date">—</p>
        </section>

        <section class="section" aria-labelledby="log-weight" data-weight-day-lock>
          <h2 class="section__title" id="log-weight">Weight</h2>
          <p class="section__note" id="weight-today-label">—</p>

          <div id="weight-form-wrap">
            <form class="record-form" id="weight-form">
              <div class="field">
                <label id="weight-lbs-label">Weight</label>
                <div class="record-form__weight" role="group" aria-labelledby="weight-lbs-label">
                  <select id="weight-whole" aria-label="Pounds" required></select>
                  <select id="weight-decimal" aria-label="Tenths of a pound" required></select>
                  <span class="record-form__unit">lbs</span>
                </div>
              </div>
              <p class="field-error" id="weight-error" hidden></p>
              <div class="btn-row">
                <button class="btn" type="submit" id="weight-save">Save today’s weight</button>
              </div>
            </form>
          </div>

          <div id="weight-locked" hidden>
            <div class="stat-row">
              <span class="stat-row__label">Logged</span>
              <span class="stat-row__value" id="weight-locked-value">—</span>
            </div>
            <p class="section__note">Locked for today. Change it on the Weight tab.</p>
          </div>
        </section>

        <section class="section" aria-labelledby="session-list-heading">
          <div class="session-head">
            <h2 class="section__title" id="session-list-heading">Today’s session</h2>
            <button class="btn" type="button" id="open-add-set">Add set</button>
          </div>
          <div id="session-list" class="session-list"></div>
          <p class="field-error" id="finish-msg" hidden></p>
          <div class="btn-row" style="margin-top: var(--space-4)">
            <button class="btn" type="button" id="finish-workout" disabled>Finish workout</button>
          </div>
        </section>

        <section class="section" aria-labelledby="log-macro">
          <h2 class="section__title" id="log-macro">Log a meal</h2>

          <form class="entry" id="log-form">
            <div class="field">
              <label for="log-category">Category</label>
              <select id="log-category" required>
                <option value="">Select category…</option>
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snack">Snack</option>
                <option value="dessert">Dessert</option>
              </select>
            </div>
            <div class="field">
              <label for="log-meal">Meal</label>
              <select id="log-meal" required disabled>
                <option value="">Select category first…</option>
              </select>
            </div>
            <p class="field-error" id="log-error" hidden></p>
            <div class="btn-row">
              <button class="btn" type="submit">Add to day</button>
            </div>
          </form>
        </section>
      </main>

      <div class="sheet" id="add-set-sheet" hidden>
        <div class="sheet__backdrop" data-close-add tabindex="-1"></div>
        <div
          class="sheet__panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="add-set-title"
        >
          <div class="sheet__header">
            <h2 class="sheet__title" id="add-set-title">Add set</h2>
            <button class="sheet__close" type="button" data-close-add aria-label="Close">
              Close
            </button>
          </div>

          <form class="record-form" id="add-set-form">
            <div class="field" id="library-category-field">
              <label for="set-category">Push / Pull / Legs</label>
              <select id="set-category"></select>
            </div>
            <div class="field" id="library-exercise-field">
              <label for="set-exercise">Exercise</label>
              <select id="set-exercise" required></select>
            </div>
            <div class="record-form__grid">
              <div class="field">
                <label for="set-reps">Reps</label>
                <select id="set-reps" required></select>
              </div>
              <div class="field">
                <label for="set-weight">Weight</label>
                <div class="record-form__weight">
                  <select id="set-weight" required></select>
                  <span class="record-form__unit">lbs</span>
                </div>
              </div>
            </div>
            <p class="field-error" id="add-set-error" hidden></p>
            <div class="btn-row">
              <button class="btn" type="submit">Save set</button>
            </div>
          </form>
        </div>
      </div>

      <nav class="tabbar" aria-label="Primary">
        <a href="today.html"><span class="tabbar__word">Day</span></a>
        <a href="sets-per-week.html"><span class="tabbar__word">Week</span></a>
        <a href="exercise-maxes.html"><span class="tabbar__word">Maxes</span></a>
        <a href="daily-macro.html"><span class="tabbar__word">Macros</span></a>
        <a href="weight-tracking.html"><span class="tabbar__word">Weight</span></a>
        <a href="settings.html"><span class="tabbar__word">Settings</span></a>
      </nav>
    </div>
    <script src="js/app-data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/undo.js"></script>
    <script src="js/exercise-library.js"></script>
    <script src="js/meals-defaults.js"></script>
    <script src="js/workout.js"></script>
    <script src="js/weight.js"></script>
    <script src="js/macro.js"></script>
  </body>
</html>
