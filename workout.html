<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eef2" />
    <title>Workout — Studio</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <p class="masthead__brand">Studio</p>
        <p class="masthead__meta">00 · Session</p>
      </header>

      <main class="page">
        <p class="page__kicker">Live log</p>
        <h1 class="page__title">Workout</h1>

        <section class="section" aria-labelledby="session-day">
          <h2 class="section__title" id="session-day">Today</h2>
          <p class="section__note" id="session-date">—</p>
        </section>

        <section class="section" aria-labelledby="session-list-heading">
          <div class="session-head">
            <h2 class="section__title" id="session-list-heading">Today’s session</h2>
            <button class="btn" type="button" id="open-add-set">Add set</button>
          </div>
          <div id="session-list" class="session-list"></div>
          <p class="field-error" id="finish-msg" hidden></p>
          <div class="btn-row" style="margin-top: var(--space-4)">
            <button class="btn" type="button" id="finish-workout" disabled>Finish workout</button>
          </div>
        </section>

        <section class="section" aria-labelledby="week-workouts-heading">
          <h2 class="section__title" id="week-workouts-heading">This week</h2>
          <p class="section__note" id="week-workouts-range">—</p>

          <div class="chart-slideshow">
            <div class="cal-nav">
              <button class="btn btn--ghost" type="button" id="week-prev" aria-label="Previous day">
                ←
              </button>
              <p class="cal-nav__label" id="week-day-label">—</p>
              <button class="btn btn--ghost" type="button" id="week-next" aria-label="Next day">
                →
              </button>
            </div>
            <p class="chart-slide-meta" id="week-day-meta"></p>
            <div id="week-workouts" class="week-workouts"></div>
          </div>
        </section>
      </main>

      <div class="sheet" id="add-set-sheet" hidden>
        <div class="sheet__backdrop" data-close-add tabindex="-1"></div>
        <div
          class="sheet__panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="add-set-title"
        >
          <div class="sheet__header">
            <h2 class="sheet__title" id="add-set-title">Add set</h2>
            <button class="sheet__close" type="button" data-close-add aria-label="Close">
              Close
            </button>
          </div>

          <form class="record-form" id="add-set-form">
            <div class="field" id="library-category-field">
              <label for="set-category">Push / Pull / Legs</label>
              <select id="set-category"></select>
            </div>
            <div class="field" id="library-exercise-field">
              <label for="set-exercise">Exercise</label>
              <select id="set-exercise" required></select>
            </div>
            <div class="record-form__grid">
              <div class="field">
                <label for="set-reps">Reps</label>
                <select id="set-reps" required></select>
              </div>
              <div class="field">
                <label for="set-weight">Weight</label>
                <div class="record-form__weight">
                  <select id="set-weight" required></select>
                  <span class="record-form__unit">lbs</span>
                </div>
              </div>
            </div>
            <p class="field-error" id="add-set-error" hidden></p>
            <div class="btn-row">
              <button class="btn" type="submit">Save set</button>
            </div>
          </form>
        </div>
      </div>

      <nav class="tabbar" aria-label="Primary">
        <a href="workout.html"><span class="tabbar__word">Lift</span></a>
        <a href="sets-per-week.html"><span class="tabbar__word">Sets</span></a>
        <a href="exercise-maxes.html"><span class="tabbar__word">Max</span></a>
        <a href="cardio-maxes.html"><span class="tabbar__word">Cardio</span></a>
        <a href="daily-macro.html"><span class="tabbar__word">Macro</span></a>
        <a href="weight-tracking.html"><span class="tabbar__word">Weight</span></a>
        <a href="settings.html"><span class="tabbar__word">Setup</span></a>
      </nav>
    </div>
    <script src="js/app-data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/undo.js"></script>
    <script src="js/exercise-library.js"></script>
    <script src="js/workout.js"></script>
  </body>
</html>
