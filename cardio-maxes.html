<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eef2" />
    <meta name="apple-mobile-web-app-title" content="Gym Buddy" />
    <title>Cardio maxes — Gym Buddy</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <p class="masthead__brand">Gym Buddy</p>
        <p class="masthead__meta">04 · Conditioning</p>
      </header>

      <main class="page">
        <p class="page__kicker">Running records</p>
        <h1 class="page__title">Cardio maxes</h1>

        <section class="section" aria-labelledby="cardio-bests">
          <h2 class="section__title" id="cardio-bests">Current bests</h2>

          <table class="ledger">
            <thead>
              <tr>
                <th>Distance</th>
                <th class="num">Best</th>
                <th class="num">Date</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1 mile</td>
                <td class="num" id="best-mile1">—</td>
                <td class="num" id="best-mile1-date">—</td>
              </tr>
              <tr>
                <td>3 mile</td>
                <td class="num" id="best-mile3">—</td>
                <td class="num" id="best-mile3-date">—</td>
              </tr>
            </tbody>
          </table>
        </section>

        <section class="section" aria-labelledby="mile1-chart-heading">
          <h2 class="section__title" id="mile1-chart-heading">1 mile — progress</h2>
          <div class="chart-block">
            <div class="chart-frame" id="chart-mile1" role="img" aria-label="One mile run times over logged dates"></div>
          </div>
          <table class="ledger">
            <thead>
              <tr>
                <th>Date</th>
                <th class="num">Time</th>
                <th class="num"></th>
              </tr>
            </thead>
            <tbody id="history-mile1">
              <tr class="is-placeholder">
                <td colspan="3">No entries yet</td>
              </tr>
            </tbody>
          </table>
        </section>

        <section class="section" aria-labelledby="mile3-chart-heading">
          <h2 class="section__title" id="mile3-chart-heading">3 mile — progress</h2>
          <div class="chart-block">
            <div class="chart-frame" id="chart-mile3" role="img" aria-label="Three mile run times over logged dates"></div>
          </div>
          <table class="ledger">
            <thead>
              <tr>
                <th>Date</th>
                <th class="num">Time</th>
                <th class="num"></th>
              </tr>
            </thead>
            <tbody id="history-mile3">
              <tr class="is-placeholder">
                <td colspan="3">No entries yet</td>
              </tr>
            </tbody>
          </table>
        </section>

        <section class="section" aria-labelledby="log-cardio">
          <h2 class="section__title" id="log-cardio">Log a run</h2>

          <form class="entry" id="cardio-form">
            <p class="entry__title">New effort</p>
            <div class="field">
              <label for="distance">Distance</label>
              <select id="distance" name="distance" required>
                <option value="mile1">1 mile</option>
                <option value="mile3">3 mile</option>
              </select>
            </div>
            <div class="field">
              <span class="field-legend" id="time-legend">Time</span>
              <div class="select-cluster" role="group" aria-labelledby="time-legend">
                <div class="select-cluster__item">
                  <label for="time-min">Min</label>
                  <select id="time-min" name="minutes" required></select>
                </div>
                <span class="select-cluster__sep" aria-hidden="true">:</span>
                <div class="select-cluster__item">
                  <label for="time-sec">Sec</label>
                  <select id="time-sec" name="seconds" required></select>
                </div>
              </div>
            </div>
            <p class="field-error" id="form-error" hidden></p>
            <div class="btn-row">
              <button class="btn" type="submit">Save run</button>
            </div>
          </form>
        </section>
      </main>

      <div class="sheet" id="edit-date-sheet" hidden>
        <div class="sheet__backdrop" data-close-date tabindex="-1"></div>
        <div
          class="sheet__panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="edit-date-title"
        >
          <div class="sheet__header">
            <h2 class="sheet__title" id="edit-date-title">Change date</h2>
            <button class="sheet__close" type="button" data-close-date aria-label="Close">
              Close
            </button>
          </div>
          <form class="record-form" id="edit-date-form">
            <div class="field">
              <span class="field-legend" id="edit-date-legend">Date</span>
              <div class="select-cluster select-cluster--date" role="group" aria-labelledby="edit-date-legend">
                <div class="select-cluster__item select-cluster__item--grow">
                  <label for="edit-month">Month</label>
                  <select id="edit-month" required></select>
                </div>
                <div class="select-cluster__item">
                  <label for="edit-day">Day</label>
                  <select id="edit-day" required></select>
                </div>
                <div class="select-cluster__item">
                  <label for="edit-year">Year</label>
                  <select id="edit-year" required></select>
                </div>
              </div>
            </div>
            <p class="field-error" id="edit-date-error" hidden></p>
            <div class="btn-row">
              <button class="btn" type="submit">Save date</button>
            </div>
          </form>
        </div>
      </div>

      <nav class="tabbar" aria-label="Primary">
        <a href="workout.html"><span class="tabbar__word">Lift</span></a>
        <a href="sets-per-week.html"><span class="tabbar__word">Sets</span></a>
        <a href="exercise-maxes.html"><span class="tabbar__word">Max</span></a>
        <a href="cardio-maxes.html"><span class="tabbar__word">Cardio</span></a>
        <a href="daily-macro.html"><span class="tabbar__word">Macro</span></a>
        <a href="weight-tracking.html"><span class="tabbar__word">Weight</span></a>
        <a href="settings.html"><span class="tabbar__word">Setup</span></a>
      </nav>
    </div>
    <script src="js/app-data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/undo.js"></script>
    <script src="js/cardio.js"></script>
  </body>
</html>
