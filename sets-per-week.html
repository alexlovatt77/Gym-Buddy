<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eef2" />
    <title>Sets per week — Studio</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <p class="masthead__brand">Studio</p>
        <p class="masthead__meta">01 · Volume</p>
      </header>

      <main class="page">
        <p class="page__kicker">Weekly volume</p>
        <h1 class="page__title">Sets per week</h1>

        <section class="section" aria-labelledby="this-week">
          <h2 class="section__title" id="this-week">This week</h2>
          <p class="section__note" id="week-range">—</p>

          <table class="ledger">
            <thead>
              <tr>
                <th>Group</th>
                <th class="num">Done</th>
                <th class="num">To go</th>
                <th class="num">Target</th>
              </tr>
            </thead>
            <tbody id="group-table"></tbody>
          </table>
        </section>

        <section class="section" aria-labelledby="week-cal">
          <h2 class="section__title" id="week-cal">Weekly calendar</h2>

          <div class="cal-nav">
            <button class="btn btn--ghost" type="button" id="sets-cal-prev" aria-label="Previous month">
              ←
            </button>
            <p class="cal-nav__label" id="sets-cal-label">—</p>
            <button class="btn btn--ghost" type="button" id="sets-cal-next" aria-label="Next month">
              →
            </button>
          </div>
          <div class="week-cal" id="week-cal-list"></div>
        </section>
      </main>

      <div class="sheet" id="week-detail-sheet" hidden>
        <div class="sheet__backdrop" data-close-week tabindex="-1"></div>
        <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="week-detail-title">
          <div class="sheet__header">
            <h2 class="sheet__title" id="week-detail-title">Week</h2>
            <button class="sheet__close" type="button" data-close-week aria-label="Close">Close</button>
          </div>
          <table class="ledger">
            <thead>
              <tr id="week-detail-head">
                <th>Group</th>
                <th class="num">Target</th>
                <th class="num">Done</th>
              </tr>
            </thead>
            <tbody id="week-detail-table"></tbody>
          </table>
        </div>
      </div>

      <nav class="tabbar" aria-label="Primary">
        <a href="workout.html"><span class="tabbar__word">Lift</span></a>
        <a href="sets-per-week.html"><span class="tabbar__word">Sets</span></a>
        <a href="exercise-maxes.html"><span class="tabbar__word">Max</span></a>
        <a href="cardio-maxes.html"><span class="tabbar__word">Cardio</span></a>
        <a href="daily-macro.html"><span class="tabbar__word">Macro</span></a>
        <a href="weight-tracking.html"><span class="tabbar__word">Weight</span></a>
        <a href="settings.html"><span class="tabbar__word">Setup</span></a>
      </nav>
    </div>
    <script src="js/app-data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/exercise-library.js"></script>
    <script src="js/targets.js"></script>
    <script src="js/sets-week.js"></script>
  </body>
</html>
