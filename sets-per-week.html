<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eef2" />
    <script src="js/theme.js?v=3"></script>
    <meta name="apple-mobile-web-app-title" content="Gym Buddy" />
    <title>Week — Gym Buddy</title>
    <link rel="stylesheet" href="css/styles.css?v=23" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <p class="masthead__brand"><a href="today.html" class="masthead__brand-link">Gym Buddy</a></p>
      </header>

      <main class="page">
        <h1 class="page__title">Week</h1>

        <section class="section" aria-labelledby="week-workouts-heading">
          <h2 class="section__title" id="week-workouts-heading">Workouts</h2>
          <p class="section__note" id="week-workouts-range">—</p>

          <div class="workout-browser">
            <div class="workout-browser__nav">
              <button class="btn btn--ghost workout-browser__arrow" type="button" id="week-prev" aria-label="Previous workout">
                ←
              </button>
              <div class="workout-browser__heading">
                <p class="workout-browser__date" id="week-day-label">—</p>
                <p class="workout-browser__position" id="week-day-position"></p>
              </div>
              <button class="btn btn--ghost workout-browser__arrow" type="button" id="week-next" aria-label="Next workout">
                →
              </button>
            </div>
            <p class="workout-browser__meta" id="week-day-meta"></p>
            <div id="week-workouts" class="week-workouts"></div>
          </div>
        </section>

        <section class="section" aria-labelledby="volume-heading">
          <h2 class="section__title" id="volume-heading">Volume</h2>
          <p class="section__note" id="week-range">—</p>

          <table class="ledger">
            <thead>
              <tr>
                <th>Group</th>
                <th class="num">Done</th>
                <th class="num">To go</th>
                <th class="num">Target</th>
              </tr>
            </thead>
            <tbody id="group-table"></tbody>
          </table>
        </section>

        <section class="section" aria-labelledby="week-cal">
          <h2 class="section__title" id="week-cal">Weekly calendar</h2>

          <div class="cal-nav">
            <button class="btn btn--ghost" type="button" id="sets-cal-prev" aria-label="Previous month">
              ←
            </button>
            <p class="cal-nav__label" id="sets-cal-label">—</p>
            <button class="btn btn--ghost" type="button" id="sets-cal-next" aria-label="Next month">
              →
            </button>
          </div>
          <div class="week-cal" id="week-cal-list"></div>
        </section>
      </main>

      <div class="sheet" id="week-detail-sheet" hidden>
        <div class="sheet__backdrop" data-close-week tabindex="-1"></div>
        <div
          class="sheet__panel sheet__panel--week-detail"
          role="dialog"
          aria-modal="true"
          aria-labelledby="week-detail-title"
        >
          <div class="sheet__header">
            <h2 class="sheet__title" id="week-detail-title">Week</h2>
            <button class="sheet__close" type="button" data-close-week aria-label="Close">Close</button>
          </div>

          <div class="week-detail">
            <section class="week-detail__block" aria-labelledby="week-detail-volume-heading">
              <h3 class="week-detail__heading" id="week-detail-volume-heading">Volume</h3>
              <table class="ledger">
                <thead>
                  <tr id="week-detail-head">
                    <th>Group</th>
                    <th class="num">Target</th>
                    <th class="num">Done</th>
                  </tr>
                </thead>
                <tbody id="week-detail-table"></tbody>
              </table>
            </section>

            <section class="week-detail__block" aria-labelledby="week-detail-workouts-heading">
              <h3 class="week-detail__heading" id="week-detail-workouts-heading">Workouts</h3>
              <div class="workout-browser workout-browser--compact">
                <div class="workout-browser__nav">
                  <button
                    class="btn btn--ghost workout-browser__arrow"
                    type="button"
                    id="week-detail-prev"
                    aria-label="Previous workout that week"
                  >
                    ←
                  </button>
                  <div class="workout-browser__heading">
                    <p class="workout-browser__date" id="week-detail-day-label">—</p>
                    <p class="workout-browser__position" id="week-detail-day-position"></p>
                  </div>
                  <button
                    class="btn btn--ghost workout-browser__arrow"
                    type="button"
                    id="week-detail-next"
                    aria-label="Next workout that week"
                  >
                    →
                  </button>
                </div>
                <p class="workout-browser__meta" id="week-detail-day-meta"></p>
                <div id="week-detail-workouts" class="week-workouts"></div>
              </div>
            </section>
          </div>
        </div>
      </div>

      <nav class="tabbar" aria-label="Primary">
        <a href="today.html"><span class="tabbar__word">Day</span></a>
        <a href="sets-per-week.html"><span class="tabbar__word">Week</span></a>
        <a href="exercise-maxes.html"><span class="tabbar__word">Maxes</span></a>
        <a href="daily-macro.html"><span class="tabbar__word">Macros</span></a>
        <a href="weight-tracking.html"><span class="tabbar__word">Weight</span></a>
        <a href="water.html"><span class="tabbar__word">Water</span></a>
        <a href="settings.html"><span class="tabbar__word">Settings</span></a>
      </nav>
    </div>
    <script src="js/app-data.js?v=3"></script>
    <script src="js/nav.js"></script>
    <script src="js/undo.js?v=2"></script>
    <script src="js/exercise-library.js?v=6"></script>
    <script src="js/targets.js"></script>
    <script src="js/workout.js?v=14"></script>
    <script src="js/sets-week.js?v=3"></script>
  </body>
</html>
