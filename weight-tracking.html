<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eef2" />
    <script src="js/theme.js?v=3"></script>
    <meta name="apple-mobile-web-app-title" content="Gym Buddy" />
    <title>Weight tracking — Gym Buddy</title>
    <link rel="stylesheet" href="css/styles.css?v=7" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <p class="masthead__brand">Gym Buddy</p>
      </header>

      <main class="page">
        <p class="page__kicker">Scale</p>
        <h1 class="page__title">Weight tracking</h1>

        <section class="section" aria-labelledby="log-weight">
          <h2 class="section__title" id="log-weight">Today</h2>
          <p class="section__note" id="today-label">—</p>

          <form class="record-form" id="weight-form">
            <div class="field">
              <label id="weight-lbs-label">Weight</label>
              <div class="record-form__weight" role="group" aria-labelledby="weight-lbs-label">
                <select id="weight-whole" aria-label="Pounds" required></select>
                <select id="weight-decimal" aria-label="Tenths of a pound" required></select>
                <span class="record-form__unit">lbs</span>
              </div>
            </div>
            <p class="field-error" id="weight-error" hidden></p>
            <div class="btn-row">
              <button class="btn" type="submit" id="weight-save">Save today’s weight</button>
            </div>
          </form>
        </section>

        <section class="section" aria-labelledby="weight-chart-heading">
          <h2 class="section__title" id="weight-chart-heading">Trend</h2>
          <p class="section__note" id="chart-mode-note">Daily</p>
          <div class="chart-block weight-chart-wrap">
            <button
              class="chart-mode-toggle"
              type="button"
              id="chart-mode-toggle"
              aria-pressed="false"
              aria-label="Switch to weekly Sunday averages"
              title="Weekly"
            >
              W
            </button>
            <div
              class="chart-frame"
              id="weight-chart"
              role="img"
              aria-label="Bodyweight chart"
            ></div>
            <div class="chart-tooltip" id="weight-tooltip" hidden></div>
          </div>
        </section>

        <section class="section" aria-labelledby="weight-history-heading">
          <h2 class="section__title" id="weight-history-heading">History</h2>
          <table class="ledger">
            <thead>
              <tr>
                <th>Date</th>
                <th class="num">Weight</th>
                <th class="num"></th>
              </tr>
            </thead>
            <tbody id="weight-history-body">
              <tr class="is-placeholder">
                <td colspan="3">No weigh-ins yet</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>

      <div class="sheet" id="edit-weight-sheet" hidden>
        <div class="sheet__backdrop" data-close-edit tabindex="-1"></div>
        <div
          class="sheet__panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="edit-weight-title"
        >
          <div class="sheet__header">
            <h2 class="sheet__title" id="edit-weight-title">Update weight</h2>
            <button class="sheet__close" type="button" data-close-edit aria-label="Close">
              Close
            </button>
          </div>
          <form class="record-form" id="edit-weight-form">
            <p class="section__note" id="edit-weight-date">—</p>
            <div class="field">
              <label id="edit-weight-lbs-label">Weight</label>
              <div class="record-form__weight" role="group" aria-labelledby="edit-weight-lbs-label">
                <select id="edit-weight-whole" aria-label="Pounds" required></select>
                <select id="edit-weight-decimal" aria-label="Tenths of a pound" required></select>
                <span class="record-form__unit">lbs</span>
              </div>
            </div>
            <p class="field-error" id="edit-weight-error" hidden></p>
            <div class="btn-row">
              <button class="btn" type="submit">Save weight</button>
              <button class="btn btn--ghost" type="button" id="edit-weight-remove">Remove</button>
            </div>
          </form>
        </div>
      </div>

      <nav class="tabbar" aria-label="Primary">
        <a href="today.html"><span class="tabbar__word">Day</span></a>
        <a href="sets-per-week.html"><span class="tabbar__word">Week</span></a>
        <a href="exercise-maxes.html"><span class="tabbar__word">Maxes</span></a>
        <a href="daily-macro.html"><span class="tabbar__word">Macros</span></a>
        <a href="weight-tracking.html"><span class="tabbar__word">Weight</span></a>
        <a href="water.html"><span class="tabbar__word">Water</span></a>
        <a href="settings.html"><span class="tabbar__word">Settings</span></a>
      </nav>
    </div>
    <script src="js/app-data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/undo.js"></script>
    <script src="js/weight.js"></script>
  </body>
</html>
